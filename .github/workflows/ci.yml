name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never reach a real API. Absent keys are what forces the clients down their
  # unconfigured paths, which is also the behaviour we want covered.
  BUG_SOURCE: seed
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Ruff only — the linter needs no project dependencies, so this job reports in seconds
      # instead of waiting on the full install.
      - run: pip install "ruff==0.8.*"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.13 is what we develop and deploy on.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: pytest
      # The Whop webhook path is only meaningfully covered against a live server: signature
      # headers, forged payloads and duplicate deliveries all depend on the raw request bytes,
      # which a TestClient-level test can misrepresent.
      - name: End-to-end webhook
        run: make e2e

  no-unmarked-stubs:
    name: No unmarked stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CLAUDE.md rule 3: every stub carries a `# FAKE:` marker, and `make fakes` must print
      # "clean" before a milestone counts as done. Wired into CI so it cannot be forgotten.
      - name: make fakes
        run: |
          output=$(make fakes)
          echo "$output"
          if [ "$output" != "clean" ]; then
            echo "::error::Unmarked or outstanding stubs found. Resolve them before merging."
            exit 1
          fi

  frontend:
    name: Landing page build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Build
        working-directory: front-end
        run: |
          npm ci
          npm run build
      # `/` falls back to app/templates/landing.html when dist/ is missing, so a broken build
      # degrades quietly rather than 500-ing. That makes an explicit assertion necessary.
      - name: Assert the build produced an entrypoint
        run: test -f front-end/dist/index.html
